; Ajustes sobre php.ini-production para la API.
expose_php = Off
memory_limit = 256M
upload_max_filesize = 2M
post_max_size = 2M
max_execution_time = 30

; OPcache: el código no cambia dentro del contenedor, así que no se revisan
; las marcas de tiempo de los archivos (validate_timestamps = 0).
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
