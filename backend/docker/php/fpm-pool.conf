; Se carga después de www.conf y zz-docker.conf de la imagen oficial.
[www]
; Las variables del contenedor (DB_*, APP_KEY...) llegan a PHP sin copiarlas en archivos.
clear_env = no

pm = dynamic
pm.max_children = 10
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
pm.max_requests = 500
