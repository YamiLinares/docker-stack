# API Laravel: Nginx sirve los archivos de public/ y pasa el resto a PHP-FPM
# (servicio "backend" de Docker Compose) por FastCGI en la red interna.
server {
    listen 8000;
    server_name _;

    root /var/www/html/public;
    index index.php;
    charset utf-8;

    client_max_body_size 2m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    # Archivos ocultos (.env, .git, .htaccess...): nunca se sirven.
    location ~ /\.(?!well-known) {
        deny all;
        return 404;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Solo se ejecuta el front controller: cualquier otro .php devuelve 404.
    location = /index.php {
        fastcgi_pass backend:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 30s;
    }

    location ~ \.php$ {
        return 404;
    }
}
