# Ecosistema de producción: Next.js 16 + Nginx + Laravel 12 (PHP-FPM) + MySQL 8.4
#
#   docker compose up --build -d
#
# Requiere un archivo .env creado a partir de .env.example.

name: docker-stack

# Variables comunes de Laravel (servicios backend y migrate).
x-laravel-env: &laravel-env
  APP_NAME: "NovaShop API"
  APP_ENV: ${APP_ENV:-production}
  APP_DEBUG: ${APP_DEBUG:-false}
  APP_KEY: ${APP_KEY:?Falta APP_KEY en .env (consulta el README)}
  APP_URL: ${APP_URL:-http://localhost:8200}
  APP_LOCALE: es
  LOG_CHANNEL: stderr
  LOG_LEVEL: ${LOG_LEVEL:-warning}
  DB_CONNECTION: ${DB_CONNECTION:-mysql}
  DB_HOST: ${DB_HOST:-mysql}
  DB_PORT: ${DB_PORT:-3306}
  DB_DATABASE: ${DB_DATABASE:?Falta DB_DATABASE en .env}
  DB_USERNAME: ${DB_USERNAME:?Falta DB_USERNAME en .env}
  DB_PASSWORD: ${DB_PASSWORD:?Falta DB_PASSWORD en .env}
  CACHE_STORE: database
  SESSION_DRIVER: array
  QUEUE_CONNECTION: sync
  AUTH_GUARD: api
  JWT_SECRET: ${JWT_SECRET:?Falta JWT_SECRET en .env (consulta el README)}
  STRIPE_KEY: ${STRIPE_KEY:-}
  STRIPE_SECRET: ${STRIPE_SECRET:-}
  STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
  STRIPE_CURRENCY: ${STORE_CURRENCY:-usd}
  # El navegador nunca llama a la API: Next.js lo hace desde el servidor.
  CORS_ALLOWED_ORIGINS: ""
  L5_SWAGGER_CONST_HOST: http://localhost:${BACKEND_PORT:-8200}

# Endurecimiento común: ningún proceso puede ganar privilegios (setuid, etc.).
x-hardening: &hardening
  security_opt:
    - no-new-privileges:true

services:
  mysql:
    image: mysql:8.4
    <<: *hardening
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Falta MYSQL_ROOT_PASSWORD en .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:?Falta MYSQL_DATABASE en .env}
      MYSQL_USER: ${MYSQL_USER:?Falta MYSQL_USER en .env}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Falta MYSQL_PASSWORD en .env}
    volumes:
      - mysql-data:/var/lib/mysql
      # Solo se ejecuta cuando el volumen está vacío (primer arranque).
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    networks: [data]
    # Sin "ports": MySQL solo es accesible dentro de la red interna "data".
    healthcheck:
      # Por TCP: durante la inicialización el servidor temporal no escucha en red,
      # así que el servicio no se marca sano hasta que MySQL está listo de verdad.
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  # Tarea de un solo uso: aplica migraciones y siembra datos en una base vacía.
  migrate:
    image: docker-stack/backend:latest
    pull_policy: never
    <<: *hardening
    command: ["sh", "-c", "php artisan migrate --force --no-interaction && php artisan db:seed-once"]
    environment:
      <<: *laravel-env
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@ecommerce.test}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
      SEED_CUSTOMER_EMAIL: ${SEED_CUSTOMER_EMAIL:-cliente@ecommerce.test}
      SEED_CUSTOMER_PASSWORD: ${SEED_CUSTOMER_PASSWORD:-}
    depends_on:
      mysql:
        condition: service_healthy
    networks: [data]
    restart: "no"

  backend:
    build:
      context: ./backend
      target: runtime
    image: docker-stack/backend:latest
    <<: *hardening
    cap_drop: [ALL]
    restart: unless-stopped
    environment: *laravel-env
    depends_on:
      mysql:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    # "backend" para recibir FastCGI de Nginx y salir a Internet (Stripe);
    # "data" para llegar a MySQL. No publica ningún puerto.
    networks: [backend, data]

  nginx:
    build:
      context: ./backend
      target: web
    image: docker-stack/nginx:latest
    <<: *hardening
    cap_drop: [ALL]
    read_only: true
    tmpfs:
      - /tmp
    restart: unless-stopped
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8200}:8000"
    depends_on:
      backend:
        condition: service_healthy
    networks: [frontend, backend]

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_SITE_URL: http://localhost:${FRONTEND_PORT:-3200}
    image: docker-stack/frontend:latest
    <<: *hardening
    cap_drop: [ALL]
    restart: unless-stopped
    environment:
      # Dirección INTERNA: nombre del servicio Nginx en la red de Docker.
      # (localhost dentro de este contenedor sería el propio frontend).
      BASE_URL: http://nginx:8000/api
      STORE_CURRENCY: ${STORE_CURRENCY:-USD}
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3200}:3000"
    depends_on:
      nginx:
        condition: service_healthy
    networks: [frontend]

  # Pruebas de PHPUnit contra el MySQL del ecosistema (no arranca con "up"):
  #   docker compose --profile test run --rm backend-tests
  backend-tests:
    profiles: [test]
    build:
      context: ./backend
      target: test
    image: docker-stack/backend-tests:latest
    environment:
      APP_KEY: ${APP_KEY}
      JWT_SECRET: ${JWT_SECRET}
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      # phpunit.xml fija la base de datos de pruebas: ecommerce_api_laravel12_test
    depends_on:
      mysql:
        condition: service_healthy
    networks: [data]

networks:
  # Navegador → frontend → nginx
  frontend:
  # nginx → backend (PHP-FPM) y salida a Internet del backend
  backend:
  # backend/migrate → mysql. internal: sin salida a Internet ni acceso desde el host.
  data:
    internal: true

volumes:
  mysql-data:
